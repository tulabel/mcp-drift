name: Question
description: Ask about the method, the metrics or how to read the results.
labels: ["topic:question"]
body:
  - type: markdown
    attributes:
      value: "**This is a public issue. Do not include confidential information, personal data or contact details.** Results are published as aggregates only; we do not publish or discuss results for individual servers or packages. / 공개 이슈입니다. 기밀·개인정보·연락처를 적지 마세요. 결과는 집계로만 공개하며, 개별 서버·패키지 결과는 공개하거나 논의하지 않습니다."
  - type: textarea
    id: question
    attributes:
      label: Question / 질문
    validations:
      required: true
